extends: "base.yml"
run_name: "DINOv2-S__padded"

wandb:
  group: "DINOv2-S__padded"

model:
  vit:
    weights: "https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_reg4_pretrain.pth"

    dinov2:
      img_size: 518
      patch_size: 14
      depth: 12
      num_heads: 6
      embed_dim: 384
      num_register_tokens: 4
      interpolate_antialias: true
      interpolate_offset: 0.0
      attn_class: "MemEffSelfAttention"
      img_side_minmax: [800, 1333]
